# ===========================================================================
# 5. IDENTITY METHOD  (acceptance criterion 2: define the identity used)
# ===========================================================================
identity_method:
  authoritative_rule: "last two BVH path components without the file suffix"
  normalized_form: "take_date/motion_file_stem"
  basis:
    - "build_domain_text_benchmark.py rel_key uses move_soma_uniform_path with the soma_uniform/bvh prefix and .bvh suffix removed (construction_script_sha256 18a602dd...)."
    - "training manifest exposes bvh_path; benchmark cases expose seed_motion.bvh_path; both reduce to the same dated relative path identity."
  why_motion_id_is_not_authoritative: >-
    Exact move_name/motion_id comparison produced 187 naming mismatches and a
    FALSE 179-case residual pool. The benchmark constructor and source
    metadata are keyed by dated BVH relative paths, not bare move_name text.
    Path identity resolves every training row to the metadata universe.
  identity_correction_audit:
    preliminary_non_authoritative_motion_id_result:
      exact_eligible_count: 179
      state: REJECTED_IDENTITY_METHOD
    authoritative_path_result:
      eligible_count: 0
      state: VERIFIED
    correction_reason: "Dated BVH relative paths are the authoritative key; bare move_name is not."
  a02_treatment: >-
    A02 adopts the inventory's AUTHORITATIVE path identity for the
    feasibility verdict. The rejected motion_id preliminary is disclosed here
    for transparency but is NOT treated as a CONFLICTING feasibility result: the
    inventory resolved the method conflict in favor of the path identity
    (motion_id REJECTED, path VERIFIED), so the feasibility classification
    rests on a single internally-consistent authoritative method.

# ===========================================================================
# 6. SET OPERATION AND COMPUTED RESULTS  (acceptance criterion 2)
# ===========================================================================
set_operation:
  definition: "eligible = U ∩ ¬T ∩ ¬H"
  notation:
    U: "Object-Manipulation non-mirror universe (|U| = 5810 unique path ids)"
    T: "candidate training manifest (|T| = 5810 unique path ids)"
    H: "SEED-test full holdout (|H| = 6938 unique path ids)"
    "¬X": "set complement with respect to the Object-Manipulation non-mirror universe U"
  identity: "last two BVH path components (take_date/motion_file_stem); exact equality; no fuzzy matching"
  computed_from_inventory:
    object_universe_x_training: 5810
    object_universe_x_holdout: 292
    training_not_in_object_universe: 0
    object_universe_not_in_training: 0
    object_universe_not_in_holdout: 5518
    eligible_outside_training_and_holdout: 0
    eligible_set_sha256: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
  derivation:
    step_1: "U ∩ T = object_universe_x_training = 5810 = |U| = 5810, so U ⊆ T."
    step_2: "Because |U| = 5810 and |T| = 5810 and U ⊆ T, the sets are equal: U = T (the candidate training manifest IS the entire non-mirror Object-Manipulation universe)."
    step_3: "Therefore U ∩ ¬T = object_universe_not_in_training = 0 (no non-mirror Object case lies outside training)."
    step_4: "eligible = U ∩ ¬T ∩ ¬H = (U ∩ ¬T) ∩ ¬H = ∅ ∩ ¬H = ∅, regardless of H."
    step_5: "eligible_outside_training_and_holdout = 0 (corroborated by eligible_set_sha256 = empty-set digest)."
  binding_constraint: >-
    Training containment alone (U = T) forces the eligible pool to be empty;
    the holdout is not the binding constraint for degeneracy. The holdout
    subset fact (U ∩ H = 292; the current Object eval is a 292/292 exact
    subset of H) is unchanged from C01-S2 but is moot for the disjoint-pool
    question because U ∩ ¬T is already empty.

# ===========================================================================
# 7. ELIGIBLE COUNTS BY SPLIT  (acceptance criterion 2: separately for Content
#    and Repetition)
# ===========================================================================
eligible_counts_by_split:
  identity_used: "last two BVH path components (take_date/motion_file_stem); authoritative"
  set_operation_used: "eligible_split = (current split cases) ∩ ¬T; maximum_eligible = U ∩ ¬T (then restricted to the split's official membership), reported per split"
  Content:
    current_cases: 235
    training_intersection: 235
    eligible_current_cases_after_training_exclusion: 0
    maximum_eligible_from_observed_universe: 0
    state: DEGENERATE
  Repetition:
    current_cases: 57
    training_intersection: 57
    eligible_current_cases_after_training_exclusion: 0
    maximum_eligible_from_observed_universe: 0
    state: DEGENERATE
  aggregate:
    current_cases_total: 292
    training_intersection_total: 292
    eligible_outside_training_and_holdout: 0
    maximum_eligible_from_observed_universe_total: 0
  interpretation: >-
    BOTH splits are degenerate. The maximum_eligible_from_observed_universe is
    0 for BOTH splits, meaning even drawing Object-Manipulation cases from the
    entire observed SEED v004 non-mirror universe yields no case outside the
    candidate training manifest. There is no non-mirror Object-Manipulation
    case in SEED v004 that is not already in training; therefore no disjoint
    Object eval — Content or Repetition — can be assembled from this universe.

# ===========================================================================
# 8. FEASIBILITY CLASSIFICATION  (acceptance criterion 3)
# ===========================================================================
feasibility_classification:
  classification: VERIFIED_DEGENERATE
  classification_state: VERIFIED
  inventory_classification: "evidence/ER1-disjoint-pool-inventory.yaml#feasibility_evidence.classification = VERIFIED_DEGENERATE"
  a02_verification: >-
    A02 verified the inventory's classification against the underlying
    set_results: |U| = 5810, |T| = 5810, U ∩ T = 5810 ⇒ U = T ⇒ U ∩ ¬T = ∅ ⇒
    eligible = ∅. The per-split split_implication (Content 0, Repetition 0;
    max-from-universe 0 for both) is internally consistent with the aggregate
    eligible_outside_training_and_holdout = 0 and the empty-set
    eligible_set_sha256. No field relies on the rejected motion_id method.
  statement: >-
    Within SEED metadata v004 and the approved training/holdout artifacts, the
    candidate training manifest equals the entire non-mirror Object-Manipulation
    universe (5810 = 5810), so NO non-mirror Object-Manipulation case lies
    outside training. The pool disjoint from BOTH training and holdout is empty
    (0 cases) for Content and Repetition alike; the maximum draw from the
    observed universe is also 0 for both splits. A non-degenerate
    Object-Manipulation evaluation pool disjoint from both the candidate
    training manifest and the full holdout DOES NOT EXIST in the observed
    SEED v004 universe. (Carried verbatim-in-substance from the inventory's
    feasibility_evidence.statement, with A02's set-derivation overlay.)
  why_not_missing: "Primary evidence is present and computed (counts + hashes + empty-set digest); this is not an absence of evidence."
  why_not_conflicting: >-
    The motion_id-vs-path method discrepancy was RESOLVED by the inventory
    (motion_id REJECTED_IDENTITY_METHOD; path VERIFIED). The feasibility
    result is internally consistent under the single authoritative method, so
    this is not a CONFLICTING classification.
  why_not_non_degenerate: "eligible_outside_training_and_holdout = 0 for both splits; the pool is empty."
  escape_hatches_requiring_out_of_scope_action:
    - "Change the candidate training data (retrain on a smaller disjoint set) — requires GPU/training, FORBIDDEN in the C01 cycle."
    - "Source a new/external or later dataset version — NOT authorized in ER-1; UNSURVEYED (see dataset_coverage_limits)."
    - "Permit mirror Object-Manipulation rows — NOT surveyed (excluded by mirror_policy); would also change the benchmark definition (see dataset_coverage_limits)."

