      A01's pre-stated secondary preference referenced. Stating this
      consistency is an OBSERVATION for hf; it is NOT a selection by A02.
  coupling_with_er2:
    statement: >-
      ER-1 closes the disjoint-POOL feasibility question (VERIFIED_DEGENERATE).
      It does NOT close the LINKAGE question (C01-RISK-09: whether
      cat_object_manip_fp32_20260811_0005.csv actually trained the candidate),
