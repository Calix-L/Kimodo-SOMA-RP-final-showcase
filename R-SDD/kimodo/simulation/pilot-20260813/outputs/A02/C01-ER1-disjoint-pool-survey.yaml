      could contain cases outside this universe.
    surveyed: false
    reason: "hf authorized only the two approved roots and ER-1; no external/later dataset was searched."
  mirror_rows_excluded_unsurveyed:
    statement: >-
      The universe applies mirror_policy is_mirror == "False" (object_nonmirror_rows
      5810). Object-Manipulation MIRROR rows were NOT surveyed: the inventory
      reports no count of Object mirror rows and no test of their disjointness
      from training/holdout. The benchmark constructor also excludes mirrors by
      default (per C01-S2 selection_criteria), so mirrors are out of scope by
      construction.
    surveyed: false
    caveat: >-
      Even if some mirror Object rows were outside training AND outside holdout,
      using them would (a) change the benchmark definition (mirrors excluded by
      construction default) and (b) require a new construction run with
      include-mirrors, which is beyond ER-1's set-metadata scope.
  no_split_column:
    statement: >-
      metadata split_columns_present = false, so no alternative official split
      assignment exists within this source record.
    decisive: false
    reason: >-
      The absence of a split column is NON-DECISIVE because U ∩ ¬T is already
      empty (zero universe residual vs training); there is no official 'test'
      split to appeal to that could supply disjoint Object cases.
  approved_roots_only:
    statement: >-
      Only the two approved roots were in scope:
      /home/share/user/zyc/kimodo and /home/share/user/zyc/kimodo_seed_repro_train.
      Other hosts/paths are unsurveyed.
  set_metadata_only:
    statement: >-
      The eligible pool is computed from set metadata (counts + ordered-set
      hashes) only — no motion content, no generation, no holdout metric
      values. final_metric_values_read = false.
  coverage_summary: >-
    VERIFIED_DEGENERATE is established within SEED v004 Object-Manipulation
    non-mirror, inside the approved roots. A non-degenerate pool is NOT
    excluded in absolute terms — it could exist in (a) a later/external
    dataset, (b) mirror Object rows, or (c) other hosts — but all three are
    outside the ER-1 authorization and were not surveyed. Whether to expand
    scope (new dataset, mirrors, or retraining) is hf's decision, not A02's.

