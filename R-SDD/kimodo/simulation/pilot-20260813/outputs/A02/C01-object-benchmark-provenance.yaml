# ===========================================================================
# 3. CLASSIFICATION RULE  (acceptance criterion 2)
# ===========================================================================
classification_rule:
  states_used: [VERIFIED, DECLARED, MISSING, CONFLICTING, NOT_APPLICABLE_AT_C01_S2]
  state_definitions:
    VERIFIED: >-
      Primary evidence available to A02 for this field: either (a) a computed
      digest / count / intersection carried from the sanitized inventory
      (collected within approved roots) and cross-checked by A02 for internal
      consistency and schema mapping, or (b) an identity match against the
      FROZEN R004 protocol. Digests are carried from the inventory, NOT
      recomputed by A02 (Bash unavailable); this is disclosed per-field, not
      silently promoted. The transport_warning residual risk is recorded as
      C01-RISK-06 and does not by itself downgrade a computed-digest field.
    DECLARED: >-
      Referenced by a name / path / prose summary in the supplied records but
      no computed digest, count, or frozen identity backs it as primary
      evidence. Per forbidden_action, names and prose summaries are NOT
      promoted to VERIFIED.
    MISSING: >-
      Needed for the pin but no value, path, hash, or owner exists in the
      supplied primary records (or the inventory explicitly marks it MISSING).
    CONFLICTING: >-
      Primary evidence exists AND shows a contradiction with a pin requirement
      (e.g., a disjointness check with intersection_count greater than 0).
      The computation is primary-verified; the conflict is in the result.
    NOT_APPLICABLE_AT_C01_S2: >-
      A populate-at-revise field (freeze block) that A02 does not and must not
      set; it is populated when hf accepts at C01-H1 and A01 records via
      research-revise. A02 records it as not-applicable-here, not as MISSING.
  carry_rule: >-
    A02 promotes a field to VERIFIED only when primary evidence (a computed
    digest, a count, an intersection, or a frozen-R004 identity match) backs
    it. Names, prose summaries, and approximate timestamps remain DECLARED.
    No field is promoted on a filename or a prose claim alone.

