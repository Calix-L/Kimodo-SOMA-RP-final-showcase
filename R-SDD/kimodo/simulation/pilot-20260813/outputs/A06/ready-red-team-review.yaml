# ===========================================================================
# 3. RECOMMENDATION — proposed only. A06 does NOT decide.
# ===========================================================================
recommendation:
  proposed_by: A06
  authority: PROPOSAL_ONLY   # A06 is forbidden from approving; HG2 owns the decision
  primary: >-
    PROCEED to staged execution of the R004 LIVE phases (R004-holdout-live ->
    R004-independent-checks -> G02-final-human-gate). The pilot is structurally
    ready: the contract is frozen and stable, HG1 is APPROVED, roles/gates are
    correctly separated, cold-start recovery succeeds, and two low-cost
    independent checks pass.
  conditions_before_any_adoption:
  - A04 registers outputs/R004/holdout-run-card.yaml with real counts, metrics, logs, environment, and deviations (exit gate: raw-holdout-evidence-registered-without-success-interpretation).
  - A05 independently recomputes the full frozen gate table -> outputs/R004/independent-gate-table.yaml.
  - A06 (or equivalent independent role) reproduces an independent check from the registered artifacts -> outputs/R004/cold-start-review.yaml; final_adopt_rule item A06_independent_reproduction_VALID must hold.
  - Human Gate 2 records a decision that explicitly addresses the retrospective-policy caveat (V2) and states whether any blinding attestation exists.
  guardrails:
  - Do NOT cite the source-snapshot AI summary or DECLARED historical run observations as adoption evidence (rule 6; integrity_rule).
  - Do NOT expand R004 to Phase 2 game-motion data or business prioritization (research.yaml scope.out).
  - Do NOT treat agent count, command count, document count, or token spend as outcomes (assessment anti-inflation list).
  - Do NOT describe the frozen thresholds as preregistered (V2); they are a retrospective acceptance policy unless a blinding attestation is later recorded.
  explicitly_not_done:
  - A06 does NOT approve R004.
  - A06 does NOT infer candidate success from the AI summary or filenames.
  - A06 does NOT make the final adoption decision.

# ===========================================================================
# 4. HUMAN DECISION AUTHORITY — who owns the final decision.
# ===========================================================================
human_decision_authority:
  final_decision_owner: Human Gate 2 (decisions/human-gate-2.yaml)
  final_decision_status: "PENDING (decision: null; reviewer_name: BLOCKING_INPUT)"
  allowed_final_decisions: [ADOPT, REJECT, REVISE, REPRODUCE, STOP]
  human_gate_1_authority_exercised: >-
    Human Gate 1 (reviewer hf) already exercised human authority to
    APPROVE_READY the evaluation contract, recorded explicitly as a
    retrospective acceptance policy.
  rule: 'AI may recommend; humans approve final claims (constitution rule 13).'
  separation: >-
    A06's recommendation above is a proposal. It becomes a final scientific
    decision ONLY when Human Gate 2 records it with rationale and primary
    evidence references. A06 cannot approve its own recommendation (A06
    forbidden_actions; HG2 instructions: "AI agents cannot approve this file").

