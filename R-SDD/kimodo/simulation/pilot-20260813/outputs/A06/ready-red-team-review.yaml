# ---------------------------------------------------------------------------
# READY red-team review of R004. This file combines the red-team review and
# the evidence-review-proposal required by the A06 role profile, because the
# task envelope (P01-A06) authorizes exactly two output paths and folds the
# proposal into the review.
#
# Findings are separated into:
#   1. VALIDITY            — is the protocol / process sound?
#   2. EVIDENCE ASSESSMENT — what does current evidence actually support?
#   3. RECOMMENDATION     — proposed only; A06 does NOT decide.
#   4. HUMAN DECISION AUTHORITY — who owns the final decision.
# Fact / Hypothesis / Observation / Evidence / Recommendation / Human Decision
# are labeled inline.
# ---------------------------------------------------------------------------

summary:
  ready_for_staged_execution: true   # structurally ready to RUN the next LIVE phases
  ready_for_adoption: false           # NOT ready to ADOPT the candidate
  one_line: >-
    Frozen contract is stable and valid as a retrospective acceptance policy;
    cold-start recovery succeeds; live holdout evidence is MISSING; final
    decision is PENDING and human-owned. A06 proposes proceeding to staged
    execution, NOT adoption.

# ===========================================================================
# 1. VALIDITY — is the R004 protocol / process sound?
# ===========================================================================
validity_findings:

- id: V1
  claim: Frozen evaluation contract is intact and was not weakened post-gate.
  type: FACT (from evidence)
  evidence:
  - research/R004/protocol.yaml status FROZEN, freeze.sha256 1f911559...
  - snapshot .specify/rsdd/protocols/R004/1f911559...yaml
  - snapshot .specify/rsdd/protocols/R004/37bbff58...yaml (pre-amendment)
  observation: >-
    Content comparison of the two frozen snapshots shows the HG1 amendment
    changed ONLY provenance fields (reviewer project-owner -> hf; timestamps
    08:10:14 -> 08:21:58; risk wording). Every numerical evaluation rule
    (target_success, non_regression, foot_skate, aggregation, metric_priority,
    final_adopt_rule, comparison_protocol) is byte-identical pre vs post.
  verdict: PASS
  constitution_rules: [6 Baseline First, 7 Evaluation Before Result, 11 Non-Regression Is a Contract, 16 Replay Integrity]

- id: V2
  claim: The frozen contract is a RETROSPECTIVE acceptance policy, NOT a preregistration.
  type: FACT (from evidence; preserved, not resolved)
  evidence:
  - decisions/human-gate-1.yaml: result_visibility_at_approval = NOT_ATTESTED
  - decisions/human-gate-1.yaml: policy_classification = RETROSPECTIVE_ACCEPTANCE_POLICY_UNLESS_BLINDING_ATTESTED
  - decisions/human-gate-1.yaml: approver_statement = "uncertain whether the final holdout result was visible before threshold approval"
  - README.md start-here step 3 instructs describing it as retrospective unless a blinding attestation is recorded
  observation: >-
    No separate blinding attestation exists in the shared records. The approver
    (hf) explicitly does not attest that thresholds were chosen blind to
    results.
  verdict: FLAG (validity caveat, NOT a concealment — the project honestly preserves it)
  impact: >-
    Weakens the "evaluation-before-result" guarantee (constitution rule 7) for
    this pilot. Human Gate 2 MUST explicitly weigh this when recording the
    final decision and must not describe the thresholds as preregistered.
  constitution_rules: [7 Evaluation Before Result, 13 Evidence Exceeds AI Opinion]

- id: V3
  claim: Separation of powers is structurally correct; AI cannot make the final decision.
  type: FACT (from evidence)
  evidence:
  - agents/A04.yaml forbidden_actions: modify frozen contract; label metric change as adoption evidence
  - agents/A06.yaml forbidden_actions: read A04 private transcript before cold-start completion; approve its own recommendation as the final decision; infer scientific success from an AI summary
  - research/R004/protocol.yaml final_adopt_rule requires A06_independent_reproduction_VALID AND human_gate_2_APPROVED
  - decisions/human-gate-2.yaml instructions: "AI agents cannot approve this file."
  - constitution rules 8, 9, 13
  verdict: PASS
  note: >-
    A04 (operator) cannot edit the contract; A06 (reviewer) cannot approve; HG2
    (human) owns the decision. The final_adopt_rule makes an AI-independent
    reproduction AND a human approval both necessary conditions.

- id: V4
  claim: Data / resource boundary is correctly declared.
  type: FACT (from evidence; runtime not yet verified)
  evidence:
  - decisions/human-gate-1.yaml resource_and_data_boundary: private_data_allowed=false, raw_credentials_in_transcript=false, external_artifact_upload=false, approved_host=lintrain, approved_gpu_count=2, approved_remote_roots=[/home/share/user/zyc/kimodo, /home/share/user/zyc/kimodo_seed_repro_train]
  - constitution rules 8 No Leakage, 15 Data Boundary
  verdict: PASS (contract-level)
  caveat: >-
    Runtime adherence is not independently verifiable yet because
    audit/session-index.yaml is NOT_STARTED. Flag carried as open risk DR-4.

- id: V5
  claim: Audit trail is not yet populated.
  type: OBSERVATION
  evidence:
  - audit/session-index.yaml status NOT_STARTED, sessions []
  - workflow.yaml audit.required_per_agent lists kscc_session_id, model, prompt_version, started_at, completed_at, token_usage, cost, output_refs, commit_sha, transcript_sha256
  verdict: FLAG (expected at P01, must be populated before P99)
  impact: Does not invalidate the contract; it is a process-completeness risk for the final assessment.

validity_summary: >-
  The R004 protocol is a valid, frozen, stable evaluation contract. Its one
  structural weakness — result blinding is NOT attested — is honestly
  preserved as a retrospective acceptance policy rather than hidden. The
  process is structurally sound for entering staged execution.

