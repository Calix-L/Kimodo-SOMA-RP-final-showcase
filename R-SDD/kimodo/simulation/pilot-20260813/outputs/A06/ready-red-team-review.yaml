    Independent sha256 recomputation of the active protocol.yaml against the
    declared digest 1f911559... was NOT performed (Bash disabled in this
    verification context). Content-identity was established by reading both the
    active file and the snapshot file in full.
  mitigation: A05 (or A02) should recompute the digest with shasum during R004-independent-checks and record it.
- id: DR-2
  severity: blocking-for-adoption
  description: Live holdout evidence is MISSING (DECLARED, run still running per source snapshot).
  mitigation: Execute R004-holdout-live (A04) then R004-independent-checks (A05 + A06).
- id: DR-3
  severity: high
  description: >-
    Result blinding is NOT attested (HG1 NOT_ATTESTED). The contract is a
    retrospective acceptance policy. If HG2 treats it as preregistered, the
    final decision would overstate the evidential strength.
  mitigation: HG2 must explicitly record the retrospective-policy status in its rationale.
- id: DR-4
  severity: medium
  description: >-
    Audit session index is NOT_STARTED; per-agent audit fields (kscc_session_id,
    model, token_usage, cost, commit_sha, transcript_sha256) are unrecorded.
  mitigation: Populate audit/session-index.yaml before P99-sync-and-assess.
- id: DR-5
  severity: medium
  description: >-
    work/codex_pipeline/ scripts are DECLARED only and not present in this
    worktree; script-level provenance cannot be independently checked here.
  mitigation: A02/A05 should verify script lineage during the R001/R002 replay phases.

