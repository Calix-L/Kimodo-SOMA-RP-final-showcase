      final_adopt_rule requires target_Content_PASS and target_Repetition_PASS,
      and Gate1 target_success_rule describes "target-domain improvement", but
      R004.inputs lists only the SEED-test holdout benchmarks
      (SEED-test-Content-3510, SEED-test-Repetition-3428). The Object
      target-domain benchmark (where improvement is expected) is not listed,
      and its Content/Repetition split counts are not frozen in R004.
    evidence:
      - kimodo/research/R004/protocol.yaml#final_adopt_rule
      - kimodo/research/R004/protocol.yaml#inputs
      - kimodo/simulation/pilot-20260813/decisions/human-gate-1.yaml#target_success_rule
    owner: A01
    human_gate: human-gate-2
    resolution: >
      Clarify and pin the Object target-domain benchmark identity and its
      Content/Repetition split counts as an R004 contract addendum (no
      threshold change, no tuning to results). Until then, target_*
      outcomes are INCONCLUSIVE.
    blocks: [target_Content_PASS, target_Repetition_PASS, independent-gate-table]

