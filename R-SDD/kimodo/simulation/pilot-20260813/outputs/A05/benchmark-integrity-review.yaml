# --- Observations (not decisions) -------------------------------------------
observations:
  - id: OBS-01
    kind: contract-gap
    statement: 'final_adopt_rule requires target_Content_PASS and target_Repetition_PASS, but R004.inputs lists only the SEED-test holdout benchmarks; the Object target-domain benchmark is not pinned in the frozen contract.'
  - id: OBS-02
    kind: dual-registration
    statement: 'foot_contact_consistency_max_drop_abs (0.005) is registered under both non_regression and foot_skate with a consistent value; not a mismatch.'
  - id: OBS-03
    kind: format-only
    statement: '0.1 vs 0.10 and 0.2 vs 0.20 are numeric-format differences in foot_skate velocity limits and FID relative increase; values are equal.'
  - id: OBS-04
    kind: frozen-in-R004-only
    statement: 'generation_batch_size, postprocess, and text_encoder_precision are frozen in R004.comparison_protocol but not restated in Gate1.statistical_rule; endorsed via protocol_sha256, not a contradiction.'
  - id: OBS-05
    kind: retrospective-acceptance
    statement: 'Result visibility at Gate 1 approval is NOT_ATTESTED; thresholds are a retrospective acceptance policy unless blinding is later attested, not a strict preregistration.'

# --- Risks ------------------------------------------------------------------
risks:
  - id: RISK-01
    severity: high
    statement: 'Target-domain (Object) benchmark is not pinned in R004.inputs; target_Content_PASS/target_Repetition_PASS could be evaluated against an unfrozen or substituted benchmark.'
    mitigation: 'A01/Human to clarify the target-domain benchmark identity and freeze its split counts WITHOUT altering any frozen threshold or tuning to candidate results.'
  - id: RISK-02
    severity: high
    statement: 'A04 holdout-run-card is MISSING; A05 cannot independently recompute the gate table until raw counts/commands/logs/metrics are registered.'
    mitigation: 'A04 registers outputs/R004/holdout-run-card.yaml (LIVE) without success interpretation; then A05 computes outputs/R004/independent-gate-table.yaml.'
  - id: RISK-03
    severity: medium
    statement: 'Independent sha256 recompute of the frozen snapshot was not executed; integrity rests on content identity and three-way string alignment.'
    mitigation: 'Re-run shasum -a 256 on the snapshot when a shell is available and confirm it equals 1f9115..e8f0e5.'
  - id: RISK-04
    severity: medium
    statement: 'Train/holdout and target train/test leakage cannot be verified from this worktree (manifests absent).'
    mitigation: 'A02/A04 to register manifest boundaries; A05 to re-check disjointness before gate-table computation.'
  - id: RISK-05
    severity: low
    statement: 'Result visibility NOT_ATTESTED weakens the preregistration claim for the thresholds.'
    mitigation: 'Surface to Human Gate 2; do not represent thresholds as preregistered.'

