# --- Threshold trace Gate1 <-> frozen R004 (acceptance criterion 2) ---------
# Fact: every threshold below was traced field-by-field between
# decisions/human-gate-1.yaml and research/R004/protocol.yaml. No mismatch found.
# Observation: 0.1 vs 0.10 and 0.2 vs 0.20 are numeric-format differences only.
threshold_trace:
  target_success:
    status: PASS
    fields_matched:
      required_splits: '[Content, Repetition]'
      minimum_improved_primary_metrics_per_split: 2
      TMR_R_at_3_improvement_pp: 1.0
      TMR_t2m_similarity_improvement_abs: 0.005
      TMR_FID_gen_text_relative_reduction: 0.05
      one_required_metric: '[TMR_R_at_3, TMR_FID_gen_text]'
      all_other_primary_metrics_must_pass_non_regression: true
      foot_skate_gate_must_pass: true
  non_regression:
    status: PASS
    fields_matched:
      TMR_R_at_3_max_drop_pp: 1.0
      TMR_t2m_similarity_max_drop_abs: 0.005
      TMR_FID_gen_text_max_increase_abs: 0.005
      TMR_FID_gen_text_max_increase_relative: '0.1 (R004) == 0.10 (Gate1)'
      foot_contact_consistency_max_drop_abs: 0.005
  statistical_rule:
    status: PASS
    fields_matched:
      comparison: 'paired_same_cases_same_prompts_same_seeds'
      effect_direction: positive_is_candidate_better
      bootstrap_iterations: 2000
      confidence: one_sided_95_percent
      pass_condition: lower_confidence_bound_greater_than_or_equal_to_negative_margin
    frozen_in_R004_only_not_restated_in_Gate1:
      - generation_batch_size: 1
      - postprocess: false
      - text_encoder_precision: fp32
    note: 'These three are part of the frozen R004 protocol that Gate1.protocol_sha256 endorses; their absence in Gate1.statistical_rule is not a contradiction.'
  foot_skate:
    status: PASS
    fields_matched:
      foot_skate_from_height_max_increase_mps: 0.002
      foot_skate_from_height_max_relative_increase: 0.05
      foot_skate_ratio_max_increase_abs: 0.01
      foot_contact_consistency_max_drop_abs: 0.005
      predicted_contact_metric_usable_only_if_contact_consistency_drop_max: 0.005
      foot_skate_max_vel_warning_relative_increase: '0.1 (R004) == 0.10 (Gate1)'
      foot_skate_max_vel_hard_fail_relative_increase: '0.2 (R004) == 0.20 (Gate1)'
      qualitative_review_sample_count: 50
      qualitative_review_selection_frozen_before_review: true
      qualitative_review_blind_randomized_AB: true
      qualitative_review_reviewer_count: 2
      qualitative_review_third_reviewer_on_disagreement: true
      qualitative_review_major_defect_rate_max_increase_pp: 5
  aggregation:
    status: PASS
    fields_matched:
      content_and_repetition_must_pass_separately: true
      cross_split_compensation: false
      macro_average_for_display_only: true
      macro_weights: 'Content 0.5 / Repetition 0.5'
      macro_average_can_determine_pass: false
      missing_or_invalid_metric: INCONCLUSIVE
  metric_priority:
    status: PASS
    hard_identical: [TMR/t2m_R/R03, TMR/t2m_sim, TMR/FID/gen_text, foot_skate_from_height, foot_skate_ratio, foot_contact_consistency]
    diagnostic_identical: [TMR/t2m_R/R01, TMR/t2m_R/R05, TMR/t2m_R/MedR, foot_skate_from_pred_contacts, foot_skate_max_vel]
  final_adopt_rule:
    status: PASS
    all_required: [target_Content_PASS, target_Repetition_PASS, holdout_Content_PASS, holdout_Repetition_PASS, foot_skate_PASS, A06_independent_reproduction_VALID, human_gate_2_APPROVED]
    note: 'final_adopt_rule is the frozen adopt rule; it references target_* and holdout_* as distinct outcomes, confirming the meaning separation above.'

