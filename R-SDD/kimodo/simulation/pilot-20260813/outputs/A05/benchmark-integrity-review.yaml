# --- Meaning separation (acceptance criterion 1) ---------------------------
# Fact: the frozen contract overloads "Content" and "Repetition" across two
# distinct benchmarks. The final_adopt_rule distinguishes target_* from
# holdout_*. The five meanings are separated below.
meaning_separation:
  Content:
    meaning: 'A benchmark split name, overloaded across two benchmarks.'
    holdout_Content:
      benchmark: SEED-test-Content-3510
      count: 3510
      role: general-capability non-regression (holdout)
      frozen_in_R004: true
      evidence: [kimodo/research/R004/protocol.yaml#inputs, kimodo/simulation/pilot-20260813/evidence-map.yaml#expected_counts]
    target_Content:
      benchmark: Object-Manipulation target-domain Content split
      count: NOT_FROZEN_IN_R004
      role: target-domain improvement (target)
      frozen_in_R004: false
      evidence: 'final_adopt_rule target_Content_PASS (R004 line 111); Gate1 target_success_rule.description = "target-domain improvement"; Object target-domain benchmark NOT listed in R004.inputs'
  Repetition:
    meaning: 'A benchmark split name, overloaded across two benchmarks.'
    holdout_Repetition:
      benchmark: SEED-test-Repetition-3428
      count: 3428
      role: general-capability non-regression (holdout)
      frozen_in_R004: true
      evidence: [kimodo/research/R004/protocol.yaml#inputs, kimodo/simulation/pilot-20260813/evidence-map.yaml#expected_counts]
    target_Repetition:
      benchmark: Object-Manipulation target-domain Repetition split
      count: NOT_FROZEN_IN_R004
      role: target-domain improvement (target)
      frozen_in_R004: false
      evidence: 'final_adopt_rule target_Repetition_PASS (R004 line 112); Object target-domain benchmark NOT listed in R004.inputs'
  target:
    meaning: 'The Object-Manipulation target-domain benchmark where the candidate is expected to IMPROVE.'
    candidate: abl_object_lr1e7_s3000_20260811
    baseline: nvidia/Kimodo-SOMA-RP-v1.1
    success_rule: 'minimum_improved_primary_metrics_per_split = 2; one_required_metric in [TMR_R_at_3, TMR_FID_gen_text]; all other primary metrics pass non-regression; foot_skate gate pass'
    improvement_thresholds:
      TMR_R_at_3_improvement_pp: 1.0
      TMR_t2m_similarity_improvement_abs: 0.005
      TMR_FID_gen_text_relative_reduction: 0.05
    construction_script: work/codex_pipeline/build_domain_text_benchmark.py
    construction_script_state: DECLARED
    construction_script_in_worktree: false
    frozen_in_R004_inputs: false
    note: 'Improvement thresholds are frozen (Gate1 target_success_rule == R004 target_success), but the benchmark they apply to is not pinned in R004.inputs and its split counts are not frozen in R004.'
  holdout:
    meaning: 'The SEED full-test general-capability benchmark where the candidate must NOT regress.'
    benchmark_splits:
      Content: 3510
      Repetition: 3428
      total: 6938
    candidate: abl_object_lr1e7_s3000_20260811
    baseline: nvidia/Kimodo-SOMA-RP-v1.1
    non_regression_thresholds:
      TMR_R_at_3_max_drop_pp: 1.0
      TMR_t2m_similarity_max_drop_abs: 0.005
      TMR_FID_gen_text_max_increase_abs: 0.005
      TMR_FID_gen_text_max_increase_relative: 0.1
      foot_contact_consistency_max_drop_abs: 0.005
    construction_script: work/codex_pipeline/build_seed_text_test_benchmark.py
    construction_script_state: DECLARED
    construction_script_in_worktree: false
    remote_output: /home/share/user/zyc/kimodo/eval_work/seed_text_test_full_eval_20260813
    run_state: DECLARED
    run_historical_observation: 'Evaluation was still running when the source snapshot was supplied'
    frozen_in_R004_inputs: true
  foot_skate:
    meaning: 'Motion-quality gate plus mandatory qualitative review; semantic gains cannot compensate for a foot-skate failure (Gate1 rationale).'
    gate_must_pass: true
    hard_metrics:
      foot_skate_from_height_max_increase_mps: 0.002
      foot_skate_from_height_max_relative_increase: 0.05
      foot_skate_ratio_max_increase_abs: 0.01
      foot_contact_consistency_max_drop_abs: 0.005
    conditional_metric:
      foot_skate_from_pred_contacts: 'usable only if foot_contact_consistency_drop <= 0.005'
    velocity_limits:
      warning_relative_increase: 0.1
      hard_fail_relative_increase: 0.2
    qualitative_review:
      sample_count: 50
      selection_frozen_before_review: true
      blind_randomized_AB: true
      reviewer_count: 2
      third_reviewer_on_disagreement: true
