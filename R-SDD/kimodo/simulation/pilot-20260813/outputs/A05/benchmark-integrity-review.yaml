  The frozen THRESHOLD contract and the frozen holdout COUNT contract are
  verified and internally consistent; every threshold traces cleanly between
  Human Gate 1 and the frozen R004 Protocol digest with no mismatch. However,
  construction-level and run-level benchmark evidence are MISSING (work/ code
