    - ref: research/R004/research.yaml
      field: protocol_amendments[0].to_sha256
      value: 1f911559b69c5a7d3b68cf269c746c76ad1384f96a23963d533560eb83e8f0e5
  frozen_snapshot:
    declared_path: .specify/rsdd/protocols/R004/1f911559b69c5a7d3b68cf269c746c76ad1384f96a23963d533560eb83e8f0e5.yaml
    present_locally: true
    content_matches_protocol_yaml: true  # evaluation/non_regression/foot_skate/aggregation/metric_priority/final_adopt_rule identical
