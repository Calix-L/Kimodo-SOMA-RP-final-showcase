        state: VERIFIED_FROM_RECORD
      - trigger: OOM
        action: STOP
        state: VERIFIED_FROM_RECORD
      - trigger: missing_checkpoint
        action: STOP
        state: VERIFIED_FROM_RECORD
      - trigger: storage_failure  # "No space"
        action: STOP
        state: VERIFIED_FROM_RECORD
      - trigger: process_failure  # traceback / "No such file"
        action: STOP
