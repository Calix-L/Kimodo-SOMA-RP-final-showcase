    Do NOT execute yet. Await orchestrator acceptance of this readiness report. Then proceed to
    R004-holdout-live (LIVE): collect/complete baseline+candidate SEED full-test eval, register
    Content 3510 / Repetition 3428 / total 6938 counts, exact commands, environment, logs, metrics,
