# Comparable-runs drift check
# (folds in the agent-profile required main-run-config-comparison content;
#  kept inside this file because the task envelope authorizes only two outputs)
# ---------------------------------------------------------------------------
comparable_runs_drift_check:
  comparison_A_main_vs_ablation:
    changed_variables:
      - "learning_rate: 2e-7 (main) -> 1e-7 (ablation)"
      - "steps: 4000 (main) -> 2000 or 3000 (ablation)"
    verdict: INTENTIONAL_MULTI_VARIABLE
    note: "Main-to-ablation is NOT a one-variable comparison; both lr and steps change. Acceptable as a separate strength-reduction question (R002 -> R003) but must not be labelled a single-variable ablation."
  comparison_B_dancing_ablation:
    runs: [abl_dancing_lr1e7_s2000_20260811, abl_dancing_lr1e7_s3000_20260811]
    declared_core_variable: "steps (2000 vs 3000)"
    held_constant_declared: ["learning_rate=1e-7", "domain=Dancing"]
    held_constant_undocumented: [dtype, warmup, batch_size, grad_accum, target_repeat, replay_size, replay_repeat, text_dropout, max_grad_norm, optimizer, loss_function, lr_schedule, seed]
    drift_state: MISSING
    note: "R003 protocol line 15 declares training duration as the core variable; undocumented hyperparameters are assumed shared but unverified."
  comparison_C_object_ablation:
    runs: [abl_object_lr1e7_s2000_20260811, abl_object_lr1e7_s3000_20260811]
    declared_core_variable: "steps (2000 vs 3000)"
    held_constant_declared: ["learning_rate=1e-7", "domain=Object-Manipulation"]
    held_constant_undocumented: [dtype, warmup, batch_size, grad_accum, target_repeat, replay_size, replay_repeat, text_dropout, max_grad_norm, optimizer, loss_function, lr_schedule, seed]
    drift_state: MISSING
  comparison_D_cross_domain_at_same_strength:
    pairs:
      - [abl_dancing_lr1e7_s2000_20260811, abl_object_lr1e7_s2000_20260811]
      - [abl_dancing_lr1e7_s3000_20260811, abl_object_lr1e7_s3000_20260811]
    declared_core_variable: "domain (Dancing vs Object)"
    held_constant_declared: ["learning_rate=1e-7", "steps"]
    held_constant_undocumented: [all training hyperparameters]
    drift_state: MISSING
    note: "Only the Object 3000-step candidate has a full hyperparameter table; Dancing runs' hyperparameters are assumed-equal, not verified."

