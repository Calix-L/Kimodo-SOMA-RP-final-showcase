classification_rule:
  states_used: [VERIFIED, DECLARED, MISSING, CONFLICTING]
  state_definitions:
    VERIFIED: >-
      Primary evidence backs this link: a computed sha256 / count /
      intersection / set-equality carried from the sanitized ER2 inventory
      (collected within approved roots) and cross-checked by A03 for internal
      consistency across the link boundary, OR an identity match against the
      FROZEN R004 protocol. Digests are carried from the inventory, NOT
      recomputed by A03 (Bash unavailable); this is disclosed per-link, not
      silently promoted. The transport_warning residual risk does not by
      itself downgrade a computed-hash link.
    DECLARED: >-
      Referenced by a name / path / prose summary in the supplied records but
      no computed hash, count, or frozen identity backs it as primary evidence
      for this link. Per forbidden_action, names and prose are NOT promoted to
      VERIFIED.
    MISSING: >-
      Needed for the chain but no value/path/hash exists in the supplied
      records (or the inventory explicitly marks it MISSING).
    CONFLICTING: >-
      Primary evidence exists AND shows a contradiction that breaks the chain
      (e.g., a set-equality check returning false, a count mismatch at a
      boundary, or a candidate-name mismatch).
  carry_rule: >-
    A03 promotes a link to VERIFIED only when primary evidence (a computed
    hash, a count, a set-equality/intersection, an observed log event, or a
    frozen-R004 identity match) backs BOTH endpoints AND the boundary between
    them. No link is promoted on a filename or a prose claim alone.

