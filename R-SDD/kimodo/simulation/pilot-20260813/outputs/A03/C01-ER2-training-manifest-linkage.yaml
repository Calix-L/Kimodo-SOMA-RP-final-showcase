# 4. MIXING ARITHMETIC CROSS-CHECK  (A03's own verification on carried counts)
# ===========================================================================
mixing_arithmetic_crosscheck:
  basis: >-
    A03 independently checks the mixed-cache decomposition carried in the ER2
    inventory (total_rows / target_rows / replay_rows / target_repeat_histogram)
    against A03's prior candidate invariants (training-invariants.yaml:
    target_repeat=2, replay_size=4000, replay_repeat=1). This is arithmetic on
    carried counts, not a recompute.
  checks:
    - check: target_rows == unique_target_path_ids * target_repeat
      computation: "11620 == 5810 * 2"
      result: TRUE
    - check: replay_rows == replay_size * replay_repeat
      computation: "4000 == 4000 * 1"
      result: TRUE
    - check: total_rows == target_rows + replay_rows
      computation: "15620 == 11620 + 4000"
      result: TRUE
    - check: target_repeat_histogram consistent with target_repeat
      computation: "{2: 5810} => every one of 5810 target ids appears exactly 2x"
      result: TRUE
    - check: target_unique_path_ids == L1 manifest unique_path_ids
      computation: "5810 == 5810"
      result: TRUE
  verdict: INTERNALLY_CONSISTENT
  implication: >-
    The mixed cache's target portion is exactly the manifest (Link-1) repeated
    twice plus a 4000-row replay pool repeated once, matching the candidate's
    documented mixing semantics. The manifest is numerically present in the
    cache that the launch command resolved for the candidate.

