      Content and Repetition are overloaded across two benchmarks: the
      SEED-test holdout (general-capability non-regression, frozen) and the
      Object target-domain benchmark (target improvement, not frozen).
      final_adopt_rule distinguishes target_* from holdout_*, confirming two
      benchmarks, but only the holdout one is pinned in R004.inputs.
  - id: OBS-C01-2
    kind: inputs-gap-not-contract-defect
    statement: >
      The insufficiency is a MISSING INPUT (the target benchmark identity,
      counts, construction, and disjointness), not a defect in any frozen
      threshold or count. Resolving it ADDS a pinned target benchmark and
      does NOT alter any frozen numerical rule.
  - id: OBS-C01-3
    kind: leakage-surface
    statement: >
      Two disjointness surfaces matter for the target benchmark: (a)
      target-eval vs target-train (the candidate was finetuned on Object
      training data; overlap would inflate target_success), and (b)
      target-eval vs SEED-test holdout (shared cases would make target
      improvement and holdout non-regression non-independent). Both are
      UNKNOWN today.

# ===========================================================================
# 3. PROTOCOL SUFFICIENCY ASSESSMENT
#    (acceptance criterion: state why the frozen Protocol is insufficient
#     WITHOUT claiming it is invalid)
# ===========================================================================
protocol_sufficiency:
  frozen_protocol_valid: true
  validity_basis: >
    A05 threshold_trace = PASS on target_success, non_regression,
    statistical_rule, foot_skate, aggregation, metric_priority, and
    final_adopt_rule; the holdout count contract = PASS with no drift. The
    Protocol is a valid, internally consistent frozen threshold +
    holdout-count contract.
  insufficient_for: target-side adoption (target_Content_PASS / target_Repetition_PASS).
  reason: >
    R004.inputs pins only the SEED-test holdout benchmark (Content 3510 /
    Repetition 3428). final_adopt_rule requires target_Content_PASS and
    target_Repetition_PASS, and the target_success thresholds are frozen,
    but NO Object target-domain benchmark is enumerated: no benchmark
    identity, no target split counts, no construction script version/hash,
    no split manifest, and no target-train/eval or target/holdout
    disjointness is frozen. Without these, target_Content_PASS and
    target_Repetition_PASS cannot be evaluated against a fixed artifact and
    could be applied to an unfrozen or substituted benchmark (A05 RISK-01).
  not_a_claim_of_invalidity: >
    The Protocol is NOT invalid. No frozen threshold, statistical rule,
    foot-skate rule, aggregation rule, or holdout count may be altered. The
    insufficiency is an inputs-completeness gap on the target side only. The
    resolution is to PIN the Object target-domain benchmark (identity +
    counts + construction + manifests + disjointness) via a future
    research-revise AFTER hf decides at C01-H1. A01 does NOT perform that
    revise here and does NOT select the benchmark.
  scope_of_change_if_pinned: >
    Only R004.inputs (plus a benchmark snapshot) would gain a pinned target
    benchmark entry. Every frozen evaluation rule in R004.evaluation remains
    byte-identical. Pinning the benchmark is additive and reversible; it
    does not re-open Gate 1's threshold endorsement (sha256 1f9115...).

