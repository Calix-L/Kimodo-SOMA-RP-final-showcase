# 4. OBSERVATIONS  (derived; not primary decisions)
# ===========================================================================
observations:
  - id: OBS-S3-1
    kind: feasibility-collapse
    statement: >
      A02's by_split data imply a NAIVE train-disjoint Object eval is
      degenerate: Content would collapse to 0 cases (235/235 overlap,
      non_overlapping 0) and Repetition to 8 (49/57 overlap, non_overlapping
      8). Removing train-overlapping cases from the EXISTING eval therefore
      cannot yield a viable target_Content_PASS eval. A viable disjoint
      benchmark would have to draw Object-Manipulation cases from OUTSIDE the
      current eval (and outside both the training manifest and the holdout);
      whether such a pool exists is UNSURVEYED.
    basis:
      - outputs/A02/C01-object-benchmark-provenance.yaml#disjointness_review.comparisons[object_eval_vs_target_train].by_split
  - id: OBS-S3-2
    kind: holdout-structural-subset
    statement: >
      The Object eval is a 100% subset of the SEED-test holdout
      (object_only_count 0). Zero current Object eval cases are
      holdout-disjoint. A holdout-disjoint Object eval requires Object cases
      absent from the 6938-case holdout; that pool is UNSURVEYED.
    basis:
      - outputs/A02/C01-object-benchmark-provenance.yaml#disjointness_review.comparisons[object_eval_vs_full_holdout]
  - id: OBS-S3-3
    kind: leakage-finding-rests-on-declared-linkage
    statement: >
      The 284-case train-overlap is computed against
      cat_object_manip_fp32_20260811_0005.csv, which is DECLARED-as-the-
      candidate's-training-manifest by naming + source summary, not VERIFIED
      by A02 (C01-RISK-09). If A03/A04 later show that manifest did NOT train
      abl_object_lr1e7_s3000_20260811, the leakage finding weakens and the
      decision frame changes.
    basis:
      - outputs/A02/C01-object-benchmark-provenance.yaml#disjointness_review.comparisons[object_eval_vs_target_train].linkage_caveat
      - outputs/A02/C01-object-benchmark-provenance.yaml#open_risks[C01-RISK-09]
  - id: OBS-S3-4
    kind: additive-not-threshold-change
    statement: >
      Resolving the C01 gap adds a pinned target benchmark to R004.inputs and
      does NOT alter any frozen threshold, count, statistical rule, foot-skate
      rule, aggregation rule, or comparison-protocol field. Any viable pin is
      recorded by research-revise AFTER C01-H1.
    basis:
      - simulation/pilot-20260813/workflow.yaml#execution_policy.protocol_change_after_ready
      - research/R004/protocol.yaml#freeze

# ===========================================================================
# 5. THREE MUTUALLY EXCLUSIVE CHOICES  (acceptance criterion 2)
#    Each carries impact + residual risk. A01 does NOT select; hf selects at
#    C01-H1.
# ===========================================================================
choices:
  - id: ALT-A
    name: ACCEPT the existing Object benchmark as-is
    decision_type_if_chosen: ACCEPT
    mutually_exclusive_with: [ALT-B, ALT-C]
    impact: >
      Pins object_manip (Content 235 / Repetition 57 / 292, manifest
      97d13dcc...) as the target benchmark. Formalizes train-on-eval leakage
      (284/292 = 97.26%) and holdout non-independence (292/292 exact subset)
      into the frozen contract. target_success would be inflated by training
      overlap, and target-domain evidence would be non-independent of the
      SEED-test holdout non-regression evidence. Construction is not
      commit-pinned (script_commit_sha MISSING).
    residual_risk:
      severity: SEVERE
      detail: >
        Directly violates constitution rule 8 (No Leakage) and A01's own C01-S1
        acceptance_rule ("any non-zero intersection forces MODIFY or REJECT").
        A02 classified ALT-A NOT_VIABLE_AS_IS. This is the only choice that
        contradicts the frozen leakage rule. NOT recommended.
  - id: ALT-B
    name: MODIFY via disjoint reconstruction (set assembly only; no GPU, no holdout)
    decision_type_if_chosen: MODIFY
    mutually_exclusive_with: [ALT-A, ALT-C]
    impact: >
      Re-run (or extend) build_domain_text_benchmark.py to construct an Object
      target eval that is VERIFIED-disjoint from BOTH the candidate training
      manifest and the SEED-test holdout, then pin it. Set-assembly only: NO
      GPU training, NO final holdout, NO holdout metric inspection. Resolves
      C01-RISK-02 and C01-RISK-03 to VERIFIED-disjoint without retraining and
      without touching any frozen threshold/count/comparison-protocol field.
      The reconstruction is also the opportunity to close C01-RISK-07
      (commit-pin in a git-backed environment), C01-RISK-08 (attest protocol
      conformance), and C01-RISK-10 (produce per-split manifests + record
      invocation hashes).
    residual_risk:
      severity: HIGH
      detail: >
        FEASIBILITY UNKNOWN. A02's by_split data show a naive train-disjoint
        eval collapses Content to 0 and Repetition to 8 (OBS-S3-1), and zero
        current Object eval cases are holdout-disjoint (OBS-S3-2). Whether a
        sufficient disjoint Object-Manipulation pool exists is UNSURVEYED.
        Requires (a) a non-degenerate disjoint pool, (b) C01-RISK-09 linkage
        verification by A03/A04, (c) C01-RISK-07 commit-pinning, (d) C01-RISK-08
        protocol conformance attestation by A05, (e) C01-RISK-10 per-split
        manifests, and (f) C01-RISK-06 clean re-collection. If the disjoint
        pool is degenerate, ALT-B is infeasible and ALT-C is forced.
  - id: ALT-C
    name: REJECT pinning / escalate
    decision_type_if_chosen: REJECT
    mutually_exclusive_with: [ALT-A, ALT-B]
    impact: >
      Refuses to pin a contaminated target benchmark. target_Content_PASS and
      target_Repetition_PASS cannot be evaluated against a fixed,
      leakage-free artifact, so final_adopt_rule cannot reach ADOPT at Human
      Gate 2. R004 stays FROZEN; no rule changes. Surfaces the confirmed
      contamination as a material finding (constitution rule 12: negative
      results are assets).
    residual_risk:
      severity: MEDIUM
      detail: >
        Leaves R004's confirmatory question unanswerable as framed. Does NOT
        by itself fix the underlying contamination; it refuses to formalize
        it. May require a later research-revise to (i) drop the target_*
        requirements, (ii) redefine the target benchmark from a disjoint pool
        if one exists, or (iii) retrain a candidate on a disjoint set (GPU,
        outside the C01 cycle). Conservative and leakage-honoring, but
        premature if a disjoint pool exists (hence the evidence request below).

# ===========================================================================
# 6. RECOMMENDATION  (non-binding; acceptance criterion 3)
# ===========================================================================
recommendation:
  binding: false
  by: A01
  choice: REQUEST_MORE_EVIDENCE
  reason: >
    A02's C01-S2 evidence is decisive on ONE point: the existing Object
    benchmark is contaminated (train-eval 284/292 = 97.26%; eval is an exact
    subset of the SEED-test holdout 292/292), so ALT-A (ACCEPT as-is) is NOT
    viable and is NOT recommended. The remaining choice between MODIFY
    (ALT-B) and REJECT (ALT-C) hinges on TWO unknowns A02 did NOT survey, and
    A01 cannot infer either from filenames or prose (forbidden_action):
      (1) FEASIBILITY: whether a non-degenerate Object-Manipulation pool
          exists that is disjoint from BOTH the candidate training manifest
          (5810 ids) AND the SEED-test full holdout (6938 ids). A02's data
          show the current eval is 100% inside the holdout and 97.26% inside
          training, and a naive train-disjoint eval collapses Content to 0
          (OBS-S3-1). Without surveying the disjoint pool, A01 cannot tell hf
          whether ALT-B is constructable or whether ALT-C is forced.
      (2) LINKAGE (C01-RISK-09): whether
          cat_object_manip_fp32_20260811_0005.csv actually trained
          abl_object_lr1e7_s3000_20260811. The 284-case leakage is computed
          against a manifest that is DECLARED-as-the-candidate's-training-set,
          not VERIFIED (OBS-S3-3). If that linkage is false, the leakage
          finding weakens and the frame changes.
    Both gaps are closable with a bounded, no-GPU, no-holdout set-membership
    evidence pass (A02 for the disjoint-pool survey; A03/A04 for the
    training-manifest linkage) before hf must decide at C01-H1. Requesting
    this evidence is proportionate (cheap, decisive) and avoids either
    over-optimistic MODIFY or premature REJECT.
  secondary_preference_if_evidence_closes_positive:
    choice: ALT-B
    statement: >
      If (a) a non-degenerate disjoint Object pool exists AND (b) the
      training-manifest linkage is confirmed, prefer ALT-B: reconstruct a
      VERIFIED-disjoint target benchmark (set assembly only) and pin it via
      research-revise, changing no frozen rule.
  secondary_preference_if_evidence_closes_negative:
    choice: ALT-C
    statement: >
      If the disjoint pool is degenerate (e.g., Content would be 0) OR the
      construction cannot be commit-pinned to hf's standard OR the linkage
      cannot be confirmed, prefer ALT-C: REJECT pinning and escalate; do not
      formalize a contaminated or unverifiable benchmark.
  not_a_selection: >
    A01 does NOT select the benchmark, counts, or manifests, and does NOT
    decide for hf. hf may override and ACCEPT / MODIFY / REJECT now on the
    existing evidence. REQUEST_MORE_EVIDENCE is a non-binding AI
    recommendation and one of the four allowed_responses.
  forbidden_respected: >
    A01 did NOT infer provenance from filenames (it cites A02's VERIFIED
    digests/counts/intersections), did NOT inspect final holdout metrics
    (set membership only), did NOT modify or refreeze R004, and did NOT fill
    hf's response.

# ===========================================================================
# 7. EVIDENCE REQUEST (the bounded C01-S2b pass REQUEST_MORE_EVIDENCE authorizes)
#    Owner mapping preserves the C01 cycle constraints (no GPU, no holdout, no
#    holdout metric inspection, set membership only).
# ===========================================================================
evidence_request:
  scope: bounded set-membership + linkage verification; NO GPU, NO final holdout, NO holdout metric inspection
  items:
    - id: ER-1
      to_agent: A02
      question: >
        Survey the Object-Manipulation case population available in the
        approved roots and compute the pool disjoint from BOTH the candidate
        training manifest (cat_object_manip_fp32_20260811_0005.csv, 5810 ids)
        AND the SEED-test full holdout (6938 ids): report |Object ∩ ¬train ∩
        ¬holdout| by split (Content, Repetition), and whether each split is
        non-degenerate (count > a usable minimum). Set membership only.
      gates: ALT-B feasibility vs ALT-C.
    - id: ER-2
      to_agent: A03
      to_agent_secondary: A04
      question: >
        Verify whether cat_object_manip_fp32_20260811_0005.csv actually trained
        abl_object_lr1e7_s3000_20260811 (C01-RISK-09). Confirm or refute the
        DECLARED training-manifest-to-candidate linkage.
      gates: whether the 284-case train-overlap is real leakage.
    - id: ER-3
      to_agent: A05
      question: >
        Attest (or plan to attest) evaluation_protocol scalar conformance
        (batch 1 / postprocess false / fp32) and paired ordered case identity
        for the target run (C01-RISK-08); inspect the combined manifest's
        per-case split label (C01-RISK-10).
      gates: ACCEPT-readiness of any reconstructed pin.
    - id: ER-4
      to_agent: hf_or_orchestrator
      question: >
        Re-collect the inventory over a clean transport (C01-RISK-06 SSH bad
        RSA signature) or attest the warning is benign; and decide whether
        construction must be commit-pinned (C01-RISK-07) or hash-pinning
        (script_sha256 + seed) is acceptable.
      gates: construction provenance standard for the pin.

