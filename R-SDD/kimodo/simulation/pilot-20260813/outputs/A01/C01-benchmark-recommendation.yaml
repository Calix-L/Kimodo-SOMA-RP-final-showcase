    via research-revise AFTER C01-H1, adding only an R004.inputs entry + a
    benchmark snapshot and changing no frozen rule. Adoption authority stays
    with Human Gate 2.
  forbidden_for_hf_reminder: >
    Changing any frozen threshold/statistical/foot-skate/aggregation rule or
    the holdout counts 3510/3428/6938 is out of scope (frozen, not on the
    table); approving candidate success is reserved for Human Gate 2.
