# ===========================================================================
handoff:
  to_agent: hf
  handoff_path: simulation/pilot-20260813/handoffs/C01-A01-to-hf.yaml
  cycle_step: C01-S3 -> C01-H1
  next_action_for_hf: >
    At C01-H1, choose ACCEPT / MODIFY / REJECT / REQUEST_MORE_EVIDENCE for
    the Object target-domain benchmark pin. A01's non-binding recommendation
    is REQUEST_MORE_EVIDENCE (bounded disjoint-pool survey ER-1 + linkage
    verification ER-2) before MODIFY (ALT-B) vs REJECT (ALT-C); ALT-A (ACCEPT
