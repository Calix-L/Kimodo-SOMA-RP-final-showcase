      non-independence (292/292 exact subset) into the frozen contract;
      target_success would be inflated and target/holdout evidence
      non-independent. Construction is not commit-pinned (script_commit_sha
      MISSING).
    residual_risk: SEVERE
    residual_risk_detail: >
      Violates constitution rule 8 (No Leakage) and A01's own C01-S1
      acceptance rule (any non-zero intersection forces MODIFY/REJECT); A02
      classified ALT-A NOT_VIABLE_AS_IS. NOT recommended.
  - id: ALT-B
    decision_type_if_chosen: MODIFY
    name: Reconstruct a disjoint Object target benchmark (set assembly only; no GPU, no holdout)
    impact: >
      Could yield a VERIFIED-disjoint pin (train-eval 0, holdout 0) resolving
      C01-RISK-02/03 without GPU training or final holdout, within the C01
      cycle constraints; no frozen threshold/count/comparison-protocol field
      changes. Also the opportunity to close C01-RISK-07/08/10.
    residual_risk: HIGH
    residual_risk_detail: >
      FEASIBILITY UNKNOWN. A02's by_split data show a naive train-disjoint
      eval collapses Content to 0 and Repetition to 8; holdout-disjoint Object
      cases are unsurveyed. Requires a sufficient disjoint pool, C01-RISK-09
      linkage verification, C01-RISK-07 commit-pinning, C01-RISK-08 protocol
      conformance, C01-RISK-10 per-split manifests, and C01-RISK-06 clean
      re-collect. If the disjoint pool is degenerate, ALT-C is forced.
  - id: ALT-C
    decision_type_if_chosen: REJECT
    name: Reject pinning / escalate
    impact: >
      Refuses to pin a contaminated benchmark; target_Content_PASS /
      target_Repetition_PASS cannot be evaluated, blocking final adoption at
      Human Gate 2; surfaces the contamination as a material finding.
    residual_risk: MEDIUM
    residual_risk_detail: >
      Leaves R004's confirmatory question unanswerable as framed; does not by
      itself fix the underlying contamination; may require a research-revise to
      drop target_* requirements, redefine the target benchmark from a
      disjoint pool, or retrain a candidate on a disjoint set (GPU, outside
      C01). Conservative but premature if a disjoint pool exists.
